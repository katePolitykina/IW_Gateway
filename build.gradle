plugins {
    id 'java'
    // Используем текущую стабильную версию Spring Boot
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

// ... (group, version, java остаются без изменений)

repositories {
    mavenCentral()
}

// Указываем соответствующую стабильную версию Spring Cloud
ext {
    set('springCloudVersion', "2023.0.2")
}

dependencies {
    // Ваши зависимости остаются без изменений
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // --- ВАЖНО: Замените 'gateway-server-webflux' на 'gateway' ---
    // В последних версиях SC суффикс был удален для краткости
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.projectlombok:lombok:1.18.32' // Рекомендую обновить lombok до последней совместимой версии
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

// ... (tasks.named('test') остается без изменений)